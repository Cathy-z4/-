<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>刷题小程序</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#07C160;--green-light:#e8f8ef;--green-dark:#06ad56;--red:#fa5151;--red-light:#fef0f0;--blue:#1677ff;--blue-light:#e8f3ff;--orange:#ff9c19;--orange-light:#fff7e8;--purple:#7c3aed;--purple-light:#f3eeff;--bg:#f6f6f6;--card:#ffffff;--text:#1a1a1a;--text-sec:#888;--text-muted:#ccc;--border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,.06);--radius:12px}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  .page{display:none;min-height:100vh;flex-direction:column;animation:pageIn .3s ease}.page.active{display:flex}
  @keyframes pageIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
  .nav-bar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:.5px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:center}
  .nav-bar .back-btn{position:absolute;left:12px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:22px;font-weight:300;transition:background .2s}
  .nav-bar .back-btn:hover{background:var(--bg)}
  .nav-bar .title{font-size:17px;font-weight:600}
  .nav-bar .card-btn{position:absolute;right:12px;height:30px;padding:0 14px;border-radius:15px;border:1.5px solid var(--green);background:var(--card);font-size:12px;font-weight:600;color:var(--green);cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
  .nav-bar .card-btn:hover{background:var(--green-light)}
  .home-header{background:linear-gradient(135deg,var(--green) 0%,#0ad88a 50%,#3cdfae 100%);padding:48px 24px 56px;position:relative;overflow:hidden}
  .home-header::before{content:'';position:absolute;top:-40%;right:-20%;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.1)}
  .home-header::after{content:'';position:absolute;bottom:-30%;left:-10%;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
  .home-header h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:8px;position:relative;z-index:1}
  .home-header p{font-size:14px;color:rgba(255,255,255,.85);font-weight:300;position:relative;z-index:1}
  .home-body{flex:1}
  .section-title{padding:20px 16px 10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
  .clear-btn{font-size:12px;font-weight:500;color:var(--red);cursor:pointer;padding:4px 10px;border-radius:12px;background:var(--red-light);border:none;transition:all .2s}
  .clear-btn:hover{background:var(--red);color:#fff}
  .bank-list{padding:0 16px 10px}
  .bank-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;align-items:center;gap:16px}
  .bank-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
  .bank-card:active{transform:scale(.98)}
  .bank-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0}
  .bank-info{flex:1}.bank-info h3{font-size:16px;font-weight:700;margin-bottom:4px}.bank-info p{font-size:12px;color:var(--text-sec)}
  .bank-arrow{color:var(--text-muted);font-size:18px}
  .record-list{padding:0 16px 20px}
  .record-card{background:var(--card);border-radius:var(--radius);padding:16px 20px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s;display:flex;align-items:center;gap:14px}
  .record-card:hover{transform:translateY(-1px)}.record-card:active{transform:scale(.98)}
  .record-ring{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
  .record-ring.good{background:var(--green-light);color:var(--green)}.record-ring.mid{background:#fff7e8;color:#ff9c19}.record-ring.bad{background:var(--red-light);color:var(--red)}
  .record-info{flex:1;min-width:0}.record-info .ri-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .record-info .ri-name{font-size:14px;font-weight:700}.record-info .ri-time{font-size:11px;color:var(--text-muted)}
  .record-info .ri-stats{font-size:12px;color:var(--text-sec)}.record-info .s-correct{color:var(--green);font-weight:600}.record-info .s-wrong{color:var(--red);font-weight:600}.record-info .s-skip{color:var(--text-muted)}
  .record-del{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
  .record-del:hover{background:var(--red-light);color:var(--red)}
  .no-record{text-align:center;padding:32px 20px;color:var(--text-muted);font-size:14px}
  .quiz-progress{padding:16px 20px 8px;display:flex;align-items:center;gap:12px}
  .quiz-progress .progress-text{font-size:14px;font-weight:600;color:var(--green);white-space:nowrap}
  .progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#3cdfae);border-radius:3px;transition:width .4s ease}
  .question-card{margin:12px 16px;background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
  .question-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:14px}
  .tag-judge{background:var(--orange-light);color:var(--orange)}.tag-choice{background:var(--green-light);color:var(--green)}.tag-multi{background:var(--purple-light);color:var(--purple)}
  .question-text{font-size:17px;font-weight:600;line-height:1.7}
  .question-text code{display:block;background:#f4f4f5;border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13px;font-family:Menlo,Consolas,'Courier New',monospace;line-height:1.6;white-space:pre-wrap;color:#333;border:1px solid #e4e4e7}
  .multi-hint{font-size:12px;color:var(--purple);margin-top:8px;font-weight:500}
  .section-divider{margin:12px 16px;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .sd-judge{background:var(--orange-light);color:var(--orange)}.sd-choice{background:var(--green-light);color:var(--green)}.sd-multi{background:var(--purple-light);color:var(--purple)}
  .options-list{padding:8px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .option-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:15px 16px;font-size:15px;color:var(--text);cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:12px;text-align:left;line-height:1.5}
  .option-btn:hover:not(.disabled){border-color:var(--blue);transform:translateX(3px)}
  .option-btn:active:not(.disabled){transform:scale(.98)}
  .option-label{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;transition:all .25s}
  .option-btn.multi-mode .option-label{border-radius:6px}
  .option-content{flex:1;padding-top:2px}
  .option-btn.selected{border-color:var(--blue);background:var(--blue-light)}
  .option-btn.selected .option-label{background:var(--blue);border-color:var(--blue);color:#fff}
  .option-btn.correct{border-color:var(--green);background:var(--green-light)}
  .option-btn.correct .option-label{background:var(--green);border-color:var(--green);color:#fff}
  .option-btn.multi-mode.correct .option-label{border-radius:6px}
  .option-btn.wrong{border-color:var(--red);background:var(--red-light)}
  .option-btn.wrong .option-label{background:var(--red);border-color:var(--red);color:#fff}
  .option-btn.multi-mode.wrong .option-label{border-radius:6px}
  .option-btn.disabled{cursor:default;pointer-events:none}
  .option-btn.disabled:not(.correct):not(.wrong):not(.selected){opacity:.4}
  .confirm-wrap{padding:4px 16px 8px}
  .confirm-btn{width:100%;height:48px;border:none;border-radius:24px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--blue),#4d9dff);box-shadow:0 4px 14px rgba(22,119,255,.3);display:none;align-items:center;justify-content:center;transition:all .25s}
  .confirm-btn.show{display:flex}
  .confirm-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,119,255,.4)}
  .confirm-btn:active{transform:scale(.97)}
  .result-toast{margin:0 16px 8px;padding:12px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;display:none;align-items:center;gap:8px}
  .result-toast.show{display:flex;animation:toastIn .3s ease}
  .result-toast.is-correct{background:var(--green-light);color:var(--green-dark)}
  .result-toast.is-wrong{background:var(--red-light);color:var(--red)}
  .result-toast .toast-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0}
  .is-correct .toast-icon{background:var(--green);color:#fff}.is-wrong .toast-icon{background:var(--red);color:#fff}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .auto-next-hint{margin:0 16px 8px;font-size:12px;color:var(--text-muted);text-align:center;display:none}
  .auto-next-hint.show{display:block;animation:toastIn .3s ease}
  .quiz-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:.5px solid var(--border);padding:10px 20px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:12px;z-index:50}
  .quiz-nav button{flex:1;height:44px;border:none;border-radius:22px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .quiz-nav button:active{transform:scale(.97)}
  .nav-prev{background:var(--bg);color:var(--text-sec)}.nav-prev:hover{background:var(--border)}.nav-prev:disabled{opacity:.3;cursor:default}
  .nav-next{background:var(--green);color:#fff;box-shadow:0 3px 12px rgba(7,193,96,.3)}.nav-next:hover{box-shadow:0 5px 16px rgba(7,193,96,.4)}
  .card-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
  .card-overlay.show{display:flex;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card-panel{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:75vh;overflow-y:auto;padding:20px 20px 32px;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .card-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .card-header h3{font-size:17px;font-weight:700}.card-header .card-count{font-size:13px;color:var(--text-sec)}
  .card-section-label{font-size:12px;font-weight:700;padding:4px 0 8px;margin-top:8px;border-bottom:1px solid var(--border)}
  .card-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px}
  .card-cell{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s;border:2px solid transparent}
  .card-cell:hover{transform:scale(1.1)}
  .card-cell.unanswered{background:var(--bg);color:var(--text-sec);border-color:var(--border)}
  .card-cell.answered-correct{background:var(--green);color:#fff}.card-cell.answered-wrong{background:var(--red);color:#fff}
  .card-cell.current{border-color:var(--blue);border-width:2.5px}
  .card-legend{display:flex;gap:20px;justify-content:center;margin-bottom:20px;font-size:12px;color:var(--text-sec)}
  .card-legend span{display:flex;align-items:center;gap:5px}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .legend-dot.green{background:var(--green)}.legend-dot.red{background:var(--red)}.legend-dot.gray{background:var(--border)}
  .card-submit{width:100%;height:48px;border:none;border-radius:24px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--green),#3cdfae);box-shadow:0 4px 14px rgba(7,193,96,.3);transition:all .2s}
  .card-submit:hover{transform:translateY(-1px)}.card-submit:active{transform:scale(.97)}
  .summary-header{background:var(--card);padding:32px 24px;text-align:center;border-bottom:.5px solid var(--border)}
  .summary-title{font-size:22px;font-weight:900;margin-bottom:24px}
  .summary-section{margin-bottom:16px}
  .summary-section-label{font-size:13px;font-weight:700;padding:0 0 8px;text-align:center;border-bottom:1px dashed var(--border);margin-bottom:10px}
  .summary-circles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto}
  .summary-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;transition:transform .2s}
  .summary-circle:hover{transform:scale(1.15)}
  .summary-circle.is-correct{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(7,193,96,.3)}
  .summary-circle.is-wrong{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(250,81,81,.3)}
  .summary-circle.is-unanswered{background:var(--border);color:var(--text-sec)}
  .summary-stats{display:flex;justify-content:center;gap:32px;margin-top:24px}
  .stat-item{text-align:center}.stat-num{font-size:28px;font-weight:900}.stat-num.green{color:var(--green)}.stat-num.red{color:var(--red)}.stat-num.gray{color:var(--text-muted)}
  .stat-label{font-size:12px;color:var(--text-sec);margin-top:2px}
  .summary-list{padding:16px;flex:1;padding-bottom:80px}
  .summary-sec-block{margin-bottom:20px}
  .summary-sec-title{font-size:14px;font-weight:700;padding:8px 14px;border-radius:8px;margin-bottom:10px}
  .summary-sec-title.st-judge{background:var(--orange-light);color:var(--orange)}
  .summary-sec-title.st-choice{background:var(--green-light);color:var(--green)}
  .summary-sec-title.st-multi{background:var(--purple-light);color:var(--purple)}
  .summary-item{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid transparent;transition:transform .2s}
  .summary-item:hover{transform:translateX(4px)}
  .summary-item.is-correct{border-left-color:var(--green)}.summary-item.is-wrong{border-left-color:var(--red)}.summary-item.is-unanswered{border-left-color:var(--text-muted)}
  .summary-item-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .summary-item-num{font-size:12px;font-weight:700;color:var(--text-sec)}
  .summary-item-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .summary-item.is-correct .summary-item-badge{background:var(--green-light);color:var(--green)}
  .summary-item.is-wrong .summary-item-badge{background:var(--red-light);color:var(--red)}
  .summary-item.is-unanswered .summary-item-badge{background:var(--bg);color:var(--text-muted)}
  .summary-item-q{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:10px}
  .summary-item-answers{font-size:13px;color:var(--text-sec);line-height:1.8}
  .your-answer{color:var(--red);font-weight:600}.correct-answer{color:var(--green);font-weight:600}
  .summary-footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:.5px solid var(--border);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:12px;z-index:50}
  .summary-footer button{flex:1;height:48px;border:none;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
  .btn-retry{background:var(--card);color:var(--green);border:2px solid var(--green)!important}.btn-retry:hover{background:var(--green-light)}
  .btn-home{background:linear-gradient(135deg,var(--green),#3cdfae);color:#fff;box-shadow:0 4px 14px rgba(7,193,96,.3)}.btn-home:hover{transform:translateY(-1px)}
  button:active{transform:scale(.97)!important}
  .detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:flex-end;justify-content:center}
  .detail-overlay.show{display:flex;animation:fadeIn .2s}
  .detail-content{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:70vh;overflow-y:auto;padding:20px 20px 32px;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
  .detail-close{display:block;margin:16px auto 0;width:44px;height:44px;border-radius:50%;border:none;background:var(--bg);font-size:18px;color:var(--text-sec);cursor:pointer;transition:background .2s}
  .detail-close:hover{background:var(--border)}
  @keyframes circlePop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  .circle-animate{animation:circlePop .4s cubic-bezier(.34,1.56,.64,1) both}
  .quiz-body{padding-bottom:80px;flex:1}
  .confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:400;align-items:center;justify-content:center}
  .confirm-overlay.show{display:flex;animation:fadeIn .15s}
  .confirm-dialog{background:var(--card);border-radius:16px;padding:24px 24px 20px;width:280px;text-align:center;animation:circlePop .25s cubic-bezier(.34,1.56,.64,1)}
  .confirm-dialog p{font-size:15px;font-weight:600;margin-bottom:20px;line-height:1.5}
  .confirm-dialog .cd-btns{display:flex;gap:12px}
  .confirm-dialog button{flex:1;height:40px;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
  .cd-cancel{background:var(--bg);color:var(--text-sec)}.cd-cancel:hover{background:var(--border)}
  .cd-ok{background:var(--red);color:#fff}.cd-ok:hover{opacity:.9}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="page active" id="pageHome">
  <div class="home-header"><h1>刷题助手</h1><p>选择题库，开始练习</p></div>
  <div class="home-body">
    <div class="bank-list" id="bankList"></div>
    <div class="section-title"><span>答题记录</span><button class="clear-btn" id="clearAllBtn" style="display:none">清空全部</button></div>
    <div class="record-list" id="recordList"><div class="no-record">暂无答题记录</div></div>
  </div>
</div>
<div class="page" id="pageQuiz">
  <div class="nav-bar"><div class="back-btn" id="quizBack">‹</div><span class="title" id="quizTitle">答题中</span><div class="card-btn" id="openCard">答题卡</div></div>
  <div class="quiz-body" id="quizBody"></div>
  <div class="quiz-nav"><button class="nav-prev" id="prevBtn">‹ 上一题</button><button class="nav-next" id="nextBtn">下一题 ›</button></div>
</div>
<div class="card-overlay" id="cardOverlay"><div class="card-panel"><div class="card-handle"></div><div class="card-header"><h3>答题卡</h3><span class="card-count" id="cardCount"></span></div><div id="cardBody"></div><div class="card-legend"><span><span class="legend-dot green"></span>正确</span><span><span class="legend-dot red"></span>错误</span><span><span class="legend-dot gray"></span>未答</span></div><button class="card-submit" id="cardSubmit">交卷</button></div></div>
<div class="page" id="pageSummary">
  <div class="nav-bar"><span class="title">答题总结</span></div>
  <div class="summary-header"><div class="summary-title">完成情况</div><div id="summaryCirclesWrap"></div><div class="summary-stats"><div class="stat-item"><div class="stat-num green" id="statCorrect">0</div><div class="stat-label">答对</div></div><div class="stat-item"><div class="stat-num red" id="statWrong">0</div><div class="stat-label">答错</div></div><div class="stat-item"><div class="stat-num gray" id="statSkip">0</div><div class="stat-label">未答</div></div></div></div>
  <div class="summary-list" id="summaryList"></div>
  <div class="summary-footer"><button class="btn-retry" id="btnRetry">重新刷题</button><button class="btn-home" id="btnHome">返回首页</button></div>
</div>
<div class="detail-overlay" id="detailOverlay"><div class="detail-content"><div class="card-handle"></div><div id="detailBody"></div><button class="detail-close" id="detailClose">✕</button></div></div>

// 板块定义
const SECTIONS=[
  {key:'judge',label:'判断题',color:'var(--orange)',cls:'sd-judge',stCls:'st-judge',tagCls:'tag-judge',start:0,count:50},
  {key:'choice',label:'选择题',color:'var(--green)',cls:'sd-choice',stCls:'st-choice',tagCls:'tag-choice',start:50,count:36},
  {key:'multi',label:'多选题',color:'var(--purple)',cls:'sd-multi',stCls:'st-multi',tagCls:'tag-multi',start:86,count:27}
];

// 获取全局索引pos所在的板块信息
function getSec(pos){
  for(const s of SECTIONS){if(pos<s.start+s.count)return{...s,posInSec:pos-s.start+1};}
  return{...SECTIONS[2],posInSec:pos-SECTIONS[2].start+1};
}
function isSecStart(pos){return SECTIONS.some(s=>pos===s.start);}

let currentIndex=0,answers={},selections={},shuffledIndices=[],autoNextTimer=null,isViewingRecord=false;
const LABELS=['A','B','C','D','E','F','G','H'];
const AUTO_NEXT_DELAY=800,STORAGE_KEY='quiz_records',MAX_RECORDS=20;

function getTotal(){return allQuestions.length}
function isAnswered(p){return answers.hasOwnProperty(p)}
function getAnsweredCount(){return Object.keys(answers).length}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function isJudgeQ(q){return q.options.length===2&&q.options[0]==='T'&&q.options[1]==='F'}
function isMultiQ(q){return Array.isArray(q.answer)&&q.answer.length>1}
function getQType(q){return isMultiQ(q)?'multi':isJudgeQ(q)?'judge':'choice'}
function getCorrectSet(q){return isMultiQ(q)?new Set(q.answer):new Set([q.answer])}
function isMultiCorrect(sel,ans){if(sel.length!==ans.length)return false;const ss=new Set(sel),cs=new Set(ans);for(const v of ss)if(!cs.has(v))return false;return true}

function renderQuestionText(q){const parts=q.question.split('<code>');let html=escapeHtml(parts[0]);if(parts.length>1){const cp=parts[1].split('</code>');html+='<code>'+escapeHtml(cp[0])+'</code>';if(cp[1])html+=escapeHtml(cp[1])}return html}
function shuffleArray(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function clearAutoNext(){if(autoNextTimer){clearTimeout(autoNextTimer);autoNextTimer=null}}

function getRecords(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
function saveRecords(r){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(r))}catch(e){}}
function addRecord(rec){const r=getRecords();r.unshift(rec);if(r.length>MAX_RECORDS)r.length=MAX_RECORDS;saveRecords(r)}
function deleteRecord(id){saveRecords(getRecords().filter(r=>r.id!==id))}
function clearAllRecords(){saveRecords([])}

function renderBankList(){
  const c=document.getElementById('bankList');
  c.innerHTML=`<div class="bank-card" data-bank-id="all"><div class="bank-icon" style="background:linear-gradient(135deg,var(--orange),var(--green),var(--purple))">H</div><div class="bank-info"><h3>HarmonyOS 题库</h3><p>判断 ${SECTIONS[0].count} 题 · 选择 ${SECTIONS[1].count} 题 · 多选 ${SECTIONS[2].count} 题 · 共 ${getTotal()} 题</p></div><div class="bank-arrow">›</div></div>`;
  c.querySelectorAll('.bank-card').forEach(card=>{card.addEventListener('click',()=>startQuiz(false))});
}
function renderRecordList(){
  const records=getRecords(),c=document.getElementById('recordList'),cb=document.getElementById('clearAllBtn');
  if(!records.length){c.innerHTML='<div class="no-record">暂无答题记录</div>';cb.style.display='none';return}
  cb.style.display='inline-block';
  c.innerHTML=records.map(r=>{const rate=r.total?r.correctCount/r.total:0;const cls=rate>=.8?'good':rate>=.5?'mid':'bad';return`<div class="record-card" data-id="${r.id}"><div class="record-ring ${cls}">${Math.round(rate*100)}%</div><div class="record-info"><div class="ri-top"><span class="ri-name">${escapeHtml(r.bankName)}</span><span class="ri-time">${escapeHtml(r.time)}</span></div><div class="ri-stats"><span class="s-correct">${r.correctCount}对</span> · <span class="s-wrong">${r.wrongCount}错</span> · <span class="s-skip">${r.skipCount}未答</span></div></div><button class="record-del" data-del-id="${r.id}">✕</button></div>`}).join('');
  c.querySelectorAll('.record-card').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('.record-del'))return;viewRecord(Number(card.dataset.id))})});
  c.querySelectorAll('.record-del').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();deleteRecord(Number(btn.dataset.delId));renderRecordList()})});
}
document.getElementById('clearAllBtn').addEventListener('click',()=>{showConfirm('确定要清空全部答题记录吗？',()=>{clearAllRecords();renderRecordList()})});
let confirmCb=null;
function showConfirm(msg,onOk){document.getElementById('confirmMsg').textContent=msg;confirmCb=onOk;document.getElementById('confirmOverlay').classList.add('show')}
document.getElementById('confirmCancel').addEventListener('click',()=>{document.getElementById('confirmOverlay').classList.remove('show');confirmCb=null});
document.getElementById('confirmOk').addEventListener('click',()=>{document.getElementById('confirmOverlay').classList.remove('show');if(confirmCb)confirmCb();confirmCb=null});

// ============ 开始答题 ============
function startQuiz(shuffle){
  shuffledIndices=shuffle?shuffleArray(allQuestions.map((_,i)=>i)):allQuestions.map((_,i)=>i);
  currentIndex=0;answers={};selections={};isViewingRecord=false;clearAutoNext();
  document.getElementById('quizTitle').textContent='HarmonyOS 题库';
  showPage('pageQuiz');renderQuestion();
}
function viewRecord(id){
  const record=getRecords().find(r=>r.id===id);if(!record)return;
  shuffledIndices=record.shuffledIndices;answers=JSON.parse(JSON.stringify(record.answers));selections={};isViewingRecord=true;
  showSummary();
}

// ============ 渲染题目 ============
function renderQuestion(){
  const pos=currentIndex,ri=shuffledIndices[pos],q=allQuestions[ri],total=getTotal(),answered=isAnswered(pos);
  const type=getQType(q),multi=type==='multi',judge=type==='judge';
  const sec=getSec(pos);
  const sel=selections[pos];
  const selSet=multi?(Array.isArray(sel)?new Set(sel):new Set()):(sel!==undefined?new Set([sel]):new Set());

  let html='';
  // 进度：显示板块内编号
  html+=`<div class="quiz-progress"><span class="progress-text">${sec.label} ${sec.posInSec}/${sec.count}</span><div class="progress-bar"><div class="progress-fill" style="width:${((pos+1)/total)*100}%"></div></div></div>`;

  // 板块分隔
  if(isSecStart(pos)){
    html+=`<div class="section-divider ${sec.cls}">— ${sec.label}（共${sec.count}题）—</div>`;
  }

  // 题目
  let qHtml=renderQuestionText(q);
  if(multi)qHtml+='<div class="multi-hint">（可选择多项，全部选对才算正确）</div>';
  html+=`<div class="question-card"><div class="question-tag ${sec.tagCls}">${sec.label}</div><div class="question-text">${sec.posInSec}. ${qHtml}</div></div>`;

  // 选项
  const correctSet=getCorrectSet(q);
  html+=`<div class="options-list">`;
  html+=q.options.map((opt,i)=>{
    let cls='option-btn';if(multi)cls+=' multi-mode';
    if(answered){
      cls+=' disabled';
      const userSel=answers[pos].selected;const userSet=multi?new Set(userSel):new Set([userSel]);
      if(correctSet.has(i)&&userSet.has(i))cls+=' correct';
      else if(!correctSet.has(i)&&userSet.has(i))cls+=' wrong';
    }else if(selSet.has(i))cls+=' selected';
    const label=judge?(opt==='T'?'T':'F'):LABELS[i];
    return`<div class="${cls}" data-index="${i}"><span class="option-label">${label}</span><span class="option-content">${escapeHtml(opt)}</span></div>`;
  }).join('');
  html+=`</div>`;

  const canConfirm=!answered&&((multi&&Array.isArray(selections[pos])&&selections[pos].length>0)||(!multi&&selections[pos]!==undefined));
  html+=`<div class="confirm-wrap"><button class="confirm-btn${canConfirm?' show':''}" id="confirmBtn2">确认提交</button></div>`;

  if(answered){
    const a=answers[pos];const tCls=a.isCorrect?'is-correct':'is-wrong';
    html+=`<div class="result-toast show ${tCls}"><span class="toast-icon">${a.isCorrect?'✓':'✗'}</span><span class="toast-text">${a.isCorrect?'回答正确':'回答错误'}</span></div>`;
  }
  html+=`<div class="auto-next-hint" id="autoNextHint2"></div>`;

  document.getElementById('quizBody').innerHTML=html;

  if(!answered){
    document.querySelectorAll('#quizBody .option-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=parseInt(btn.dataset.index);
        if(multi){if(!Array.isArray(selections[pos]))selections[pos]=[];const si=selections[pos].indexOf(idx);if(si===-1)selections[pos].push(idx);else selections[pos].splice(si,1);}
        else{selections[pos]=idx;}renderQuestion();
      });
    });
  }
  const cb=document.getElementById('confirmBtn2');if(cb)cb.addEventListener('click',()=>handleSubmit());

  document.getElementById('prevBtn').disabled=(pos===0);
  document.getElementById('nextBtn').textContent=pos>=total-1?'查看总结':'下一题 ›';
}

function handleSubmit(){
  const pos=currentIndex;if(isAnswered(pos))return;
  const q=allQuestions[shuffledIndices[pos]],multi=isMultiQ(q),sel=selections[pos];
  if(multi){if(!Array.isArray(sel)||sel.length===0)return;answers[pos]={selected:[...sel].sort(),isCorrect:isMultiCorrect(sel,q.answer)};}
  else{if(sel===undefined)return;answers[pos]={selected:sel,isCorrect:sel===q.answer};}
  renderQuestion();
  const hint=document.getElementById('autoNextHint2'),isLast=pos>=getTotal()-1;
  if(hint){hint.textContent=isLast?'正在进入总结...':'正在跳转下一题...';hint.classList.add('show');}
  clearAutoNext();
  autoNextTimer=setTimeout(()=>{if(isLast)showSummary();else{currentIndex++;renderQuestion();window.scrollTo(0,0)}},AUTO_NEXT_DELAY);
}

document.getElementById('prevBtn').addEventListener('click',()=>{clearAutoNext();if(currentIndex>0){currentIndex--;renderQuestion();window.scrollTo(0,0)}});
document.getElementById('nextBtn').addEventListener('click',()=>{clearAutoNext();if(currentIndex>=getTotal()-1)showSummary();else{currentIndex++;renderQuestion();window.scrollTo(0,0)}});
document.getElementById('quizBack').addEventListener('click',()=>{clearAutoNext();showPage('pageHome');renderRecordList()});

// ============ 答题卡 ============
document.getElementById('openCard').addEventListener('click',()=>{clearAutoNext();renderCardPanel();document.getElementById('cardOverlay').classList.add('show')});
document.getElementById('cardOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('cardOverlay'))document.getElementById('cardOverlay').classList.remove('show')});

function renderCardPanel(){
  const total=getTotal();document.getElementById('cardCount').textContent=`已答 ${getAnsweredCount()}/${total}`;
  let html='';
  for(const sec of SECTIONS){
    html+=`<div class="card-section-label" style="color:${sec.color}">${sec.label}（${sec.count}题）</div>`;
    html+=`<div class="card-grid">`;
    for(let i=sec.start;i<sec.start+sec.count;i++){
      let cls='card-cell';
      if(isAnswered(i))cls+=answers[i].isCorrect?' answered-correct':' answered-wrong';
      else cls+=' unanswered';
      if(i===currentIndex)cls+=' current';
      html+=`<div class="${cls}" data-pos="${i}">${i-sec.start+1}</div>`;
    }
    html+=`</div>`;
  }
  document.getElementById('cardBody').innerHTML=html;
  document.querySelectorAll('#cardBody .card-cell').forEach(cell=>{
    cell.addEventListener('click',()=>{currentIndex=parseInt(cell.dataset.pos);document.getElementById('cardOverlay').classList.remove('show');renderQuestion();window.scrollTo(0,0)});
  });
}
document.getElementById('cardSubmit').addEventListener('click',()=>{document.getElementById('cardOverlay').classList.remove('show');showSummary()});

// ============ 格式化答案 ============
function fmtAnswer(q,idxArr){const judge=isJudgeQ(q);return idxArr.map(i=>{const opt=q.options[i];return judge?(opt==='T'?'T':'F'):LABELS[i]}).join('')}

// ============ 总结页 ============
function showSummary(){
  clearAutoNext();const total=getTotal();let cc=0,wc=0,sc=0;
  for(let i=0;i<total;i++){if(isAnswered(i)){if(answers[i].isCorrect)cc++;else wc++;}else sc++;}
  if(!isViewingRecord){
    const now=new Date(),pad=n=>String(n).padStart(2,'0');
    addRecord({id:Date.now(),bankName:'HarmonyOS 题库',time:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,total,correctCount:cc,wrongCount:wc,skipCount:sc,answers:JSON.parse(JSON.stringify(answers)),shuffledIndices:[...shuffledIndices]});
  }

  // 圆圈按板块分组
  const cw=document.getElementById('summaryCirclesWrap');let cwHtml='';
  for(const sec of SECTIONS){
    cwHtml+=`<div class="summary-section"><div class="summary-section-label" style="color:${sec.color};border-color:${sec.color}">${sec.label}</div><div class="summary-circles">`;
    for(let i=sec.start;i<sec.start+sec.count;i++){
      let cls='summary-circle circle-animate';
      if(isAnswered(i))cls+=answers[i].isCorrect?' is-correct':' is-wrong';else cls+=' is-unanswered';
      const delay=(i-sec.start)*0.03;
      cwHtml+=`<div class="${cls}" style="animation-delay:${delay}s" data-pos="${i}">${i-sec.start+1}</div>`;
    }
    cwHtml+=`</div></div>`;
  }
  cw.innerHTML=cwHtml;
  cw.querySelectorAll('.summary-circle').forEach(el=>{
    el.addEventListener('click',()=>showDetail(parseInt(el.dataset.pos)));
  });

  document.getElementById('statCorrect').textContent=cc;document.getElementById('statWrong').textContent=wc;document.getElementById('statSkip').textContent=sc;

  // 列表按板块分组
  const lc=document.getElementById('summaryList');let lcHtml='';
  for(const sec of SECTIONS){
    lcHtml+=`<div class="summary-sec-block"><div class="summary-sec-title ${sec.stCls}">${sec.label}（${sec.count}题）</div>`;
    for(let i=sec.start;i<sec.start+sec.count;i++){
      const q=allQuestions[shuffledIndices[i]],qText=q.question.replace(/<code>[\s\S]*?<\/code>/,'[代码]'),answered=isAnswered(i);
      const multi=isMultiQ(q),posInSec=i-sec.start+1;
      let cls='summary-item',badge='';
      if(answered){cls+=answers[i].isCorrect?' is-correct':' is-wrong';badge=answers[i].isCorrect?'正确':'错误';}else{cls+=' is-unanswered';badge='未答';}
      let ah='';
      if(answered){
        const sel=answers[i].selected;const userArr=multi?sel:[sel];const correctArr=multi?q.answer:[q.answer];
        ah=`你的答案：<span class="${answers[i].isCorrect?'correct-answer':'your-answer'}">${fmtAnswer(q,userArr)}</span>`;
        if(!answers[i].isCorrect)ah+=`<br>正确答案：<span class="correct-answer">${fmtAnswer(q,correctArr)}</span>`;
      }else{const correctArr=multi?q.answer:[q.answer];ah=`正确答案：<span class="correct-answer">${fmtAnswer(q,correctArr)}</span>`;}
      lcHtml+=`<div class="${cls}"><div class="summary-item-header"><span class="summary-item-num">第 ${posInSec} 题</span><span class="summary-item-badge">${badge}</span></div><div class="summary-item-q">${escapeHtml(qText)}</div><div class="summary-item-answers">${ah}</div></div>`;
    }
    lcHtml+=`</div>`;
  }
  lc.innerHTML=lcHtml;
  showPage('pageSummary');
}

// ============ 详情弹窗 ============
function showDetail(pos){
  const q=allQuestions[shuffledIndices[pos]],answered=isAnswered(pos),multi=isMultiQ(q),judge=isJudgeQ(q);
  const correctSet=getCorrectSet(q),sec=getSec(pos);
  const fmtLabel=i=>judge?(q.options[i]==='T'?'T':'F'):LABELS[i];
  const body=document.getElementById('detailBody');
  body.innerHTML=`
    <div style="margin-bottom:12px"><span style="font-size:12px;font-weight:700;color:var(--text-sec)">${sec.label} · 第 ${sec.posInSec} 题</span>
    ${answered?`<span style="margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;${answers[pos].isCorrect?'background:var(--green-light);color:var(--green)':'background:var(--red-light);color:var(--red)'}">${answers[pos].isCorrect?'正确':'错误'}</span>`:`<span style="margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--text-muted)">未答</span>`}
    </div>
    <div style="font-size:16px;font-weight:600;line-height:1.7;margin-bottom:16px">${renderQuestionText(q)}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${q.options.map((opt,i)=>{
        let bg='var(--bg)',bd='var(--border)',co='var(--text-sec)',ls='border:1.5px solid var(--border);color:var(--text-sec)',icon='',br=multi?'border-radius:6px':'border-radius:50%';
        const isCorrectOpt=correctSet.has(i);
        const userSel=answered?answers[pos].selected:undefined;
        const userSet=answered?(multi?new Set(userSel):new Set([userSel])):new Set();
        const userChoseThis=userSet.has(i);
        if(answered){
          if(isCorrectOpt&&userChoseThis){bg='var(--green-light)';bd='var(--green)';co='var(--green)';ls='background:var(--green);color:#fff;'+br;icon='<span style="color:var(--green);font-weight:900">✓</span>';}
          else if(!isCorrectOpt&&userChoseThis){bg='var(--red-light)';bd='var(--red)';co='var(--red)';ls='background:var(--red);color:#fff;'+br;icon='<span style="color:var(--red);font-weight:900">✗</span>';}
          else if(isCorrectOpt&&!userChoseThis){bg='var(--green-light)';bd='var(--green)';co='var(--green)';ls='background:var(--green);color:#fff;'+br;icon='<span style="color:var(--green);font-weight:900">✓</span>';}
        }
        return`<div style="padding:12px 14px;border-radius:8px;border:1.5px solid ${bd};background:${bg};display:flex;align-items:center;gap:10px"><span style="width:24px;height:24px;${br};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;${ls}">${fmtLabel(i)}</span><span style="flex:1;font-size:14px;color:${co}">${escapeHtml(opt)}</span>${icon}</div>`;
      }).join('')}
    </div>`;
  document.getElementById('detailOverlay').classList.add('show');
}
document.getElementById('detailClose').addEventListener('click',()=>document.getElementById('detailOverlay').classList.remove('show'));
document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('detailOverlay'))document.getElementById('detailOverlay').classList.remove('show')});

document.getElementById('btnRetry').addEventListener('click',()=>startQuiz(true));
document.getElementById('btnHome').addEventListener('click',()=>{showPage('pageHome');renderRecordList()});

document.addEventListener('keydown',e=>{
  if(!document.getElementById('pageQuiz').classList.contains('active'))return;
  if(document.getElementById('cardOverlay').classList.contains('show'))return;
  const pos=currentIndex,answered=isAnswered(pos),q=allQuestions[shuffledIndices[pos]];
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();clearAutoNext();if(pos>0){currentIndex--;renderQuestion();window.scrollTo(0,0)}}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();clearAutoNext();if(pos<getTotal()-1){currentIndex++;renderQuestion();window.scrollTo(0,0)}}
  else if(e.key==='Enter'){if(!answered)handleSubmit();}
  else if(!answered){
    const judge=isJudgeQ(q),multi=isMultiQ(q);
    const km=judge?{'1':0,'2':1,'t':0,'f':1}:multi?{'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}:{'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    const idx=km[e.key.toLowerCase()];if(idx!==undefined&&idx<q.options.length){
      if(multi){if(!Array.isArray(selections[pos]))selections[pos]=[];const si=selections[pos].indexOf(idx);if(si===-1)selections[pos].push(idx);else selections[pos].splice(si,1);}
      else{selections[pos]=idx;}renderQuestion();
    }
  }
});

renderBankList();renderRecordList();
</script>
